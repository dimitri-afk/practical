 <label style="margin-top: 10px;" for="digit">Berapa digit password yang diinginkan:</label>


  <input class="" aria-label="Default select example" type="number" id="digit" min="1">

  <button style="margin-left: 100px;  " class="btn btn-dark" onclick="generatePassword()">Generate</button>
  
  <p id="result"></p>
  
  <script>
    function generatePassword() {
      const digit = parseInt(document.getElementById("digit").value);
      
      const a = "1234567890";
      const b = "qwertyuiopasdfghjklzxcvbnm";
      const d = "QWERTYUIOPASDFGHJKLZXCVBNM";
      const c = a + b + d;
      
      let password = "";
      for (let i = 0; i < digit; i++) {
        const randomIndex = Math.floor(Math.random() * c.length);
        password += c[randomIndex];
      }
      
      document.getElementById("result").textContent = "Ini password mu: " + password;
    }
  </script>
