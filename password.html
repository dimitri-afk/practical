<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; background: #f4f4f4; }
    .container { background: white; padding: 30px; border-radius: 10px; width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    input, button { margin: 10px; padding: 10px; font-size: 16px; }
    #result { font-size: 20px; font-weight: bold; margin-top: 20px; }
    #strength { height: 10px; width: 100%; margin-top: 10px; border-radius: 5px; }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<body>


<nav class="navbar fixed-top bg-body-tertiary " data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" style="margin-left: 10px;" href="index.html">Back Home</a>
  </div>
</nav>




  <div style="margin-top: 100px;" class="container">
    <h2>🔐 Password Generator</h2>
    <label for="digit">Berapa digit password yang diinginkan:</label>
    <input type="number" id="digit" min="4" max="32">
    <button onclick="generatePassword()">Generate</button>
    <button onclick="copyPassword()">Copy</button>
    
    <p id="result"></p>
    <div id="strength"></div>
  </div>

  <script>
    function generatePassword() {
      const digit = parseInt(document.getElementById("digit").value);
      const a = "1234567890";
      const b = "qwertyuiopasdfghjklzxcvbnm";
      const d = "QWERTYUIOPASDFGHJKLZXCVBNM";
      const s = "!@#$%^&*";
      const c = a + b + d + s;

      let password = "";
      for (let i = 0; i < digit; i++) {
        const randomIndex = Math.floor(Math.random() * c.length);
        password += c[randomIndex];
      }

      document.getElementById("result").textContent = "🔑 Password: " + password;

      // Strength indicator
      const strengthBar = document.getElementById("strength");
      if (digit < 6) {
        strengthBar.style.background = "red";
      } else if (digit < 10) {
        strengthBar.style.background = "orange";
      } else {
        strengthBar.style.background = "green";
      }
    }

    function copyPassword() {
      const text = document.getElementById("result").textContent.replace("🔑 Password: ", "");
      navigator.clipboard.writeText(text);
      alert("Password berhasil disalin!");
    }
  </script>
</body>
</html>
